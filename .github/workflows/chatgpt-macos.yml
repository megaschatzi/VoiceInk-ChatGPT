name: VoiceInk ChatGPT macOS

on:
  push:
    branches: [feature/chatgpt-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test ChatGPT protocol
        run: swift test
      - name: Typecheck native ChatGPT client
        run: >-
          swiftc -typecheck -swift-version 5
          VoiceInk/Infrastructure/Providers/ChatGPT/ChatGPTProtocol.swift
          VoiceInk/Infrastructure/Providers/ChatGPT/ChatGPTClient.swift
          VoiceInk/Infrastructure/Credentials/KeychainService.swift
      - uses: actions/cache/restore@v4
        id: whisper-cache
        with:
          path: ~/VoiceInk-Dependencies/whisper.cpp/build-apple
          key: whisper-macos-${{ runner.arch }}-4da27c41cebadb3cbbcd2563e9c7cbc8d84bdcad
      - name: Prepare Whisper for macOS
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-whisper-macos.sh
      - uses: actions/cache/save@v4
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        with:
          path: ~/VoiceInk-Dependencies/whisper.cpp/build-apple
          key: whisper-macos-${{ runner.arch }}-4da27c41cebadb3cbbcd2563e9c7cbc8d84bdcad
      - name: Build separate test app
        run: make local LOCAL_CODESIGN_IDENTITY=-
      - name: Verify and package app
        run: |
          set -euo pipefail
          APP="$HOME/Downloads/VoiceInk ChatGPT.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.megaschatzi.VoiceInk.ChatGPT"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" VoiceInk-ChatGPT-macOS.zip
          shasum -a 256 VoiceInk-ChatGPT-macOS.zip > VoiceInk-ChatGPT-macOS.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-ChatGPT-macOS
          path: |
            VoiceInk-ChatGPT-macOS.zip
            VoiceInk-ChatGPT-macOS.zip.sha256
          retention-days: 14
          if-no-files-found: error
